[package]
name = "simpleaf-implant"
version = "0.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
lazy_static = "1.4"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "winbase", "processthreadsapi", "wincon"] }
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
strip = true
